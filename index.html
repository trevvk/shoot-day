<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoot Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#174A6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shoot Day">
<style>
@font-face{font-family:"Archivo";src:url("fonts/archivo.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --teal:#3FA7A3;--deep:#17878A;--navy:#174A6E;--ink:#1C1A33;--coral:#E8444C;--orange:#F38A25;--sun:#FFCF73;
  --bg:#F2F6F6;--surface:#FFFFFF;--field:#E9F1F1;--text:#1C1A33;--muted:#5C6575;--line:#D7E1E3;
  --k-ready:var(--teal);--k-ceremony:var(--navy);--k-portraits:var(--coral);--k-reception:var(--orange);--k-other:#8A93A3;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131B;--surface:#1A1D28;--field:#232736;--text:#EEF1F5;--muted:#9AA3B3;--line:#2B3040;--k-ceremony:#5E93C9;--navy:#5E93C9;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#11131B;--surface:#1A1D28;--field:#232736;--text:#EEF1F5;--muted:#9AA3B3;--line:#2B3040;--k-ceremony:#5E93C9;--navy:#5E93C9;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.stripe{display:flex;height:6px}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--teal)}.stripe i:nth-child(2){background:var(--deep)}.stripe i:nth-child(3){background:#174A6E}.stripe i:nth-child(4){background:var(--ink)}.stripe i:nth-child(5){background:var(--coral)}.stripe i:nth-child(6){background:var(--orange)}.stripe i:nth-child(7){background:var(--sun)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:720px;margin:0 auto}
.who{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0}
.who b{display:block;font-size:20px;font-weight:800;font-stretch:88%;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
main{max-width:720px;margin:0 auto;padding:4px 16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--text)}
nav.tabs button[aria-current="true"] svg{color:var(--deep)}
h2{font-size:15px;font-weight:700;margin:26px 0 10px;color:var(--muted)}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
.primary{background:var(--deep);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}
.ghost{background:var(--field);border:0;border-radius:12px;padding:12px 16px;font-weight:600}
.danger{background:none;border:1px solid var(--coral);color:var(--coral);border-radius:12px;padding:11px 16px;font-weight:600}

/* NOW */
.now{position:relative;background:var(--surface);border-radius:20px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.now .band{height:10px;background:var(--kc)}
.now .body{padding:18px 20px 20px}
.now .label{font-size:14px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.now .time{font-size:min(31vw,148px);font-weight:800;font-stretch:62%;line-height:.86;letter-spacing:-.02em;margin:10px 0 8px;font-variant-numeric:tabular-nums;color:var(--kc)}
.now .ev{font-size:26px;font-weight:750;font-stretch:90%;line-height:1.15}
.now .place{color:var(--muted);margin-top:4px}
.now .note{margin-top:12px;padding:10px 12px;background:var(--field);border-radius:10px;font-size:15px}
.countdown{font-variant-numeric:tabular-nums}
.shotlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.tick{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--field);border-radius:12px;padding:12px 14px;text-align:left;font-size:16px;font-weight:600}
.tick .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.tick[aria-pressed="true"]{color:var(--muted);text-decoration:line-through}
.tick[aria-pressed="true"] .box{background:var(--deep);border-color:var(--deep)}
.tick[aria-pressed="true"] .box::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.tick small{display:block;font-weight:400;color:var(--muted);text-decoration:none;font-size:13px;margin-top:2px}
.upnext{margin-top:8px}
.row{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.row .t{flex:none;width:58px;font-weight:800;font-stretch:72%;font-size:22px;font-variant-numeric:tabular-nums;color:var(--kc)}
.row .e{flex:1;min-width:0}
.row .e b{font-weight:650;display:block}
.row .e span{font-size:14px;color:var(--muted)}
.preview{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.preview input[type=range]{flex:1;min-width:160px;accent-color:var(--deep)}
.flagnote{display:flex;gap:10px;align-items:center;margin-top:14px;width:100%;border:1px dashed var(--orange);background:none;border-radius:12px;padding:11px 14px;text-align:left;font-weight:600}
.flagnote .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}

/* DAY */
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{position:relative;padding-left:16px}
.tl li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--kc);border-radius:3px}
.tl li.past{opacity:.5}
.tl li.cur::after{content:"";position:absolute;left:-5px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--kc);border:3px solid var(--bg)}
.tl button.item{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.tl .t{flex:none;width:62px;font-weight:800;font-stretch:72%;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tl .est .t{color:var(--muted)}
.est-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--orange);border:1px dashed var(--orange);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.alert-tag{font-size:12px;color:var(--muted);margin-left:6px}
.tl .e b{font-weight:650}
.tl .e span{display:block;font-size:14px;color:var(--muted)}
.tl .e span.est-tag,.tl .e span.alert-tag{display:inline-block;margin-top:0}
.tl .e span.alert-tag{margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0;background:var(--kc)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* SHOTS */
.progress{height:8px;background:var(--field);border-radius:6px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--deep)}

/* PEOPLE */
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.person .p{flex:1;min-width:0}
.person .p b{display:block;font-weight:650}
.person .p span{font-size:14px;color:var(--muted)}
.person a{flex:none;text-decoration:none;color:var(--text);background:var(--field);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px}
.person a.call{background:var(--deep);color:#fff}
.nonum{font-size:13px;color:var(--orange);font-weight:600}

/* INFO */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.card.kind{border-left:6px solid var(--kc)}
.card h3{margin:0 0 2px;font-size:17px;font-weight:700}
.card p{margin:6px 0 0;font-size:15px}
.card .meta{font-size:14px;color:var(--muted)}
.card a{color:var(--deep);font-weight:600}
.alertcard{border-color:var(--coral);border-left:6px solid var(--coral)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:12px;resize:vertical}

/* SHEET */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:50;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .22s ease;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h3{font-size:22px;font-weight:800;font-stretch:88%;margin:4px 0 14px}
.sheet .inner{max-width:680px;margin:0 auto}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:var(--deep)}
.wlist{list-style:none;margin:0 0 16px;padding:0}
.wlist button{width:100%;display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;background:var(--field);border-radius:12px;padding:13px 14px;margin-bottom:8px;font-weight:650}
.wlist button[aria-current="true"]{outline:2px solid var(--deep)}
.wlist span{font-weight:400;color:var(--muted);font-size:14px}
.status{font-size:14px;color:var(--muted);margin-top:10px;min-height:1.4em}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:560px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
.toast b{display:block;font-size:17px}
.toast button{margin-top:8px;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.k-ready{--kc:var(--k-ready)}.k-ceremony{--kc:var(--k-ceremony)}.k-portraits{--kc:var(--k-portraits)}.k-reception{--kc:var(--k-reception)}.k-other{--kc:var(--k-other)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<header>
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bar">
    <button class="who" id="whoBtn" aria-label="Switch wedding"><b id="whoTitle">Shoot day</b><span id="whoSub">Loading…</span></button>
    <button class="iconbtn" id="weddingsBtn">Weddings</button>
  </div>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="inner" id="sheetBody"></div></div>
<div class="toast" id="toast" role="alert"></div>
<input type="file" id="fileIn" accept=".json,application/json" multiple hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KINDS = {ready:"Getting ready", ceremony:"Ceremony", portraits:"Portraits", reception:"Reception", other:"Other"};
const CATS = {detail:"Details", moment:"Moments", group:"Groups"};
const ICONS = {
  now:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  day:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  shots:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};
const TABS = [["now","Now"],["day","Day"],["shots","Shots"],["people","People"],["info","Venues"]];

const S = { weddings: [], cur: null, tab: "now", preview: null, fired: new Set() };

/* ---------- storage ---------- */
const LS = "tkp-shootday-v1";
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch { return null; } }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify({weddings:S.weddings, cur:S.cur?.id})); } catch {} }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(lsSave, 150); }
function saveNow(){ clearTimeout(saveT); lsSave(); }
addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- time ---------- */
const toMin = t => { const m = /^(\d{1,2})[:.](\d{2})/.exec(t || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const fmt = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const isDay = w => w && w.date === todayISO();
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function clock(){ return S.preview != null ? S.preview : (isDay(S.cur) ? nowMin() : null); }
function niceDate(iso){ if (!iso) return "No date"; const d = new Date(iso + "T12:00"); return d.toLocaleDateString("en-IE", {weekday:"long", day:"numeric", month:"long", year:"numeric"}); }
function daysUntil(iso){ const a = new Date(todayISO()+"T12:00"), b = new Date(iso+"T12:00"); return Math.round((b - a) / 864e5); }
function sorted(w){ return [...w.timeline].sort((a,b) => (toMin(a.time) ?? 9999) - (toMin(b.time) ?? 9999)); }
function place(w, key){ return w.places.find(p => p.key === key); }
function kindOf(w, item){ return place(w, item.place)?.kind || "other"; }
function shot(w, id){ return w.shots.find(s => s.id === id); }

/* ---------- render ---------- */
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button data-tab="${k}" aria-current="${S.tab===k}">${ICONS[k]}${l}</button>`).join("");
}
function renderHeader(){
  const w = S.cur;
  $("#whoTitle").textContent = w ? w.title : "Shoot day";
  if (!w) { $("#whoSub").textContent = "No wedding loaded"; return; }
  const d = daysUntil(w.date);
  $("#whoSub").textContent = niceDate(w.date) + (d > 0 ? ` · in ${d} day${d>1?"s":""}` : d === 0 ? " · today" : "");
}
function render(){
  renderHeader(); renderTabs();
  const w = S.cur, m = $("#main");
  if (!w) { m.innerHTML = `<div class="empty"><b>No wedding yet</b>Open a wedding file. Send Claude the couple's planner and you'll get one back.<div class="actions" style="justify-content:center"><button class="primary" data-act="import">Open wedding file</button><button class="ghost" data-act="blank">Start blank</button></div><div class="status" id="impStatus"></div></div>`; return; }
  m.innerHTML = ({now:vNow, day:vDay, shots:vShots, people:vPeople, info:vInfo})[S.tab](w);
}
function tickBtn(s, small){
  return `<button class="tick" data-shot="${esc(s.id)}" aria-pressed="${!!s.done}"><span class="box"></span><span>${esc(s.label)}${small && s.notes ? `<small>${esc(s.notes)}</small>` : ""}</span></button>`;
}
function vNow(w){
  const items = sorted(w), c = clock();
  const day = isDay(w);
  let cur = null, next = null;
  if (c != null) { for (const it of items) { const t = toMin(it.time); if (t == null) continue; if (t <= c) cur = it; else { next = it; break; } } }
  const focus = cur || items[0];
  if (!focus) return `<div class="empty"><b>No timeline yet</b>Add items on the Day tab.</div>`;
  const after = items.slice(items.indexOf(focus) + 1, items.indexOf(focus) + 4);
  const k = kindOf(w, focus), p = place(w, focus.place);
  let lbl = "First up";
  if (c != null && cur) lbl = "Happening now";
  let cd = "";
  if (c != null && next) { const diff = toMin(next.time) - c; cd = `<span class="countdown">${esc(next.event)} in ${diff} min</span>`; }
  const shots = (focus.shots || []).map(id => shot(w, id)).filter(Boolean);
  const openFlags = (w.flags || []).filter(f => !f.done).length;
  const pv = day && S.preview == null ? "" : `<div class="preview"><label for="pv">Preview the day at <b>${fmt(c ?? toMin(items[0].time) ?? 780)}</b></label><input id="pv" type="range" min="${Math.max(0,(toMin(items[0].time)??600)-30)}" max="${Math.min(1439,(toMin(items.at(-1).time)??1200)+30)}" step="5" value="${c ?? toMin(items[0].time) ?? 780}">${S.preview!=null && day ? `<button class="ghost" data-act="live">Back to live</button>` : ""}</div>`;
  return `
  ${!day && S.preview == null ? `<p style="color:var(--muted);margin:8px 0 0;font-size:15px">${daysUntil(w.date) > 0 ? "This goes live on the morning of the wedding." : "This wedding day has passed."} Drag the slider to rehearse it.</p>` : ""}
  <section class="now k-${k}" aria-live="polite">
    <div class="band"></div>
    <div class="body">
      <div class="label"><span>${lbl}${focus.est ? '<span class="est-tag">estimate</span>' : ""}</span>${cd}</div>
      <div class="time">${esc(focus.time || "--:--")}</div>
      <div class="ev">${esc(focus.event)}</div>
      <div class="place">${esc(p ? (p.name || p.label) : "")}</div>
      ${focus.notes ? `<div class="note">${esc(focus.notes)}</div>` : ""}
      ${shots.length ? `<ul class="shotlist">${shots.map(s => `<li>${tickBtn(s, s.cat === "group")}</li>`).join("")}</ul>` : ""}
    </div>
  </section>
  ${pv}
  ${openFlags ? `<button class="flagnote" data-goto="info"><span class="dot"></span>${openFlags} thing${openFlags>1?"s":""} to confirm with the couple</button>` : ""}
  ${after.length ? `<h2>Up next</h2><div class="upnext">${after.map(it => `<div class="row k-${kindOf(w,it)}"><span class="t">${esc(it.time)}</span><span class="e"><b>${esc(it.event)}${it.est?'<span class="est-tag">est.</span>':""}</b><span>${esc(place(w,it.place)?.label || "")}${it.shots?.length ? ` · ${it.shots.length} shot${it.shots.length>1?"s":""}` : ""}</span></span></div>`).join("")}</div>` : ""}
  ${w.sun?.sunset ? `<h2>Light</h2><div class="card"><h3>Sunset ${esc(w.sun.sunset)}${w.sun.est?'<span class="est-tag">estimate</span>':""}</h3><p class="meta">Golden hour: ${esc(w.sun.golden || "")}</p></div>` : ""}`;
}
function vDay(w){
  const items = sorted(w), c = clock();
  let curId = null; if (c != null) for (const it of items) { const t = toMin(it.time); if (t != null && t <= c) curId = it.id; }
  const curIdx = items.findIndex(i => i.id === curId);
  const kinds = [...new Set(w.places.map(p => p.kind))];
  return `<div class="legend">${kinds.map(k => `<span class="k-${k}"><i></i>${KINDS[k]}</span>`).join("")}<span><span class="est-tag" style="margin:0 4px 0 0">est.</span>placeholder time</span></div>
  <ul class="tl">${items.map((it, i) => `<li class="k-${kindOf(w,it)} ${curIdx>=0 && i<curIdx ? "past" : ""} ${it.id===curId ? "cur" : ""} ${it.est ? "est" : ""}"><button class="item" data-edit="${esc(it.id)}"><span class="t">${esc(it.time || "--:--")}</span><span class="e"><b>${esc(it.event)}</b>${it.est ? '<span class="est-tag">est.</span>' : ""}${it.alert ? `<span class="alert-tag">alert ${it.alert} min before</span>` : ""}<span>${esc(place(w,it.place)?.label || "")}${it.notes ? " · " + esc(it.notes) : ""}</span>${it.shots?.length ? `<span>${it.shots.map(id => esc(shot(w,id)?.label || "")).join(", ")}</span>` : ""}</span></button></li>`).join("")}</ul>
  <div class="actions"><button class="primary" data-act="add">Add to timeline</button><button class="ghost" data-act="ics">Send alerts to my calendar</button></div>
  <div class="status" id="icsStatus"></div>`;
}
function vShots(w){
  const all = w.shots.length, done = w.shots.filter(s => s.done).length;
  return `<div class="card"><h3>${done} of ${all} captured</h3><div class="progress"><i style="width:${all ? done/all*100 : 0}%"></i></div></div>
  ${Object.entries(CATS).map(([k,l]) => { const list = w.shots.filter(s => s.cat === k); return list.length ? `<h2>${l}</h2><ul class="shotlist">${list.map(s => `<li>${tickBtn(s, true)}</li>`).join("")}</ul>` : ""; }).join("")}
  <div class="card" style="margin-top:22px"><h3>Their style</h3><p>${esc((w.style?.tags || []).join(", "))}</p>${w.style?.loves ? `<p class="meta">Loves: ${esc(w.style.loves)}</p>` : ""}${w.style?.avoid ? `<p class="meta">Their words: ${esc(w.style.avoid)}</p>` : ""}</div>
  <div class="actions"><button class="ghost" data-act="addshot">Add a shot</button><button class="ghost" data-act="resetshots">Untick all</button></div>`;
}
function tel(n){ return String(n || "").replace(/[^\d+]/g, ""); }
function vPeople(w){
  const ppl = [...w.couple.map((c,i) => ({role: i ? "Partner 2" : "Partner 1", ...c})), ...w.contacts];
  return `<h2>On the day</h2>${ppl.map(p => `<div class="person"><div class="p"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>${tel(p.phone) ? `<a href="sms:${tel(p.phone)}" aria-label="Text ${esc(p.name)}">Text</a><a class="call" href="tel:${tel(p.phone)}" aria-label="Call ${esc(p.name)}">Call</a>` : `<span class="nonum">No number</span>`}</div>`).join("")}
  <div class="actions"><button class="ghost" data-act="addperson">Add a contact</button></div>`;
}
function vInfo(w){
  const flags = w.flags || [];
  const fam = w.family || {};
  return `
  ${flags.length ? `<h2>To confirm with the couple</h2><ul class="shotlist">${flags.map((f,i) => `<li><button class="tick" data-flag="${i}" aria-pressed="${!!f.done}"><span class="box"></span><span>${esc(f.text)}</span></button></li>`).join("")}</ul>` : ""}
  ${fam.sensitivities ? `<div class="card alertcard" style="margin-top:22px"><h3>Family</h3><p>${esc(fam.sensitivities)}</p>${fam.helper ? `<p class="meta">Gathering groups: ${esc(fam.helper)}</p>` : ""}${fam.mobility ? `<p class="meta">Mobility: ${esc(fam.mobility)}</p>` : ""}</div>` : ""}
  <h2>Venues</h2>
  ${w.places.map(p => `<div class="card kind k-${p.kind}"><p class="meta" style="margin:0">${esc(p.label)}${p.arrive ? ` · arrive ${esc(p.arrive)}` : ""}</p><h3>${esc(p.name || "Not given")}</h3>${p.address ? `<p><a href="https://maps.google.com/?q=${encodeURIComponent(p.address)}" target="_blank" rel="noopener">${esc(p.address)}</a></p>` : ""}${p.contact ? `<p class="meta">${esc(p.contact)}</p>` : ""}${p.notes ? `<p>${esc(p.notes)}</p>` : ""}</div>`).join("")}
  <h2>Before the wedding</h2>
  <ul class="shotlist">${(w.prep||[]).map((p,i) => `<li><button class="tick" data-prep="${i}" aria-pressed="${!!p.done}"><span class="box"></span><span>${esc(p.label)}</span></button></li>`).join("")}</ul>
  <h2>Weather back-up</h2><div class="card"><p style="margin:0">${esc(w.weather || "Not given yet.")}</p></div>
  <h2>My notes</h2><textarea id="notes" placeholder="Anything to remember on the day">${esc(w.notes || "")}</textarea>`;
}

/* ---------- sheet ---------- */
function openSheet(html){ $("#sheetBody").innerHTML = html; $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); setTimeout(() => $("#sheet input, #sheet button")?.focus(), 230); }
function closeSheet(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
function editItem(id){
  const w = S.cur, it = id ? w.timeline.find(t => t.id === id) : {id:"", time:"", event:"", place:w.places[0]?.key, notes:"", est:false, shots:[], alert:5};
  openSheet(`<h3>${id ? "Edit" : "Add to timeline"}</h3>
  <label class="field"><span>Time</span><input id="f-time" type="time" value="${esc(it.time)}"></label>
  <label class="field"><span>What's happening</span><input id="f-event" value="${esc(it.event)}"></label>
  <label class="field"><span>Where</span><select id="f-place">${w.places.map(p => `<option value="${esc(p.key)}" ${p.key===it.place?"selected":""}>${esc(p.label)}</option>`).join("")}</select></label>
  <label class="field"><span>Notes</span><input id="f-notes" value="${esc(it.notes)}"></label>
  <label class="field"><span>Alert</span><select id="f-alert">${[0,5,10,15,30].map(n => `<option value="${n}" ${+it.alert===n?"selected":""}>${n ? n + " minutes before" : "No alert"}</option>`).join("")}</select></label>
  <label class="check"><input type="checkbox" id="f-est" ${it.est?"checked":""}> Placeholder time, still to confirm</label>
  <label class="field"><span>Shots for this moment</span></label>
  <div class="shotlist" style="margin-bottom:14px">${w.shots.map(s => `<label class="check" style="margin:0"><input type="checkbox" class="f-shot" value="${esc(s.id)}" ${(it.shots||[]).includes(s.id)?"checked":""}> ${esc(s.label)}</label>`).join("")}</div>
  <div class="actions"><button class="primary" data-act="saveitem" data-id="${esc(id||"")}">Save</button><button class="ghost" data-act="close">Cancel</button>${id ? `<button class="danger" data-act="delitem" data-id="${esc(id)}">Delete</button>` : ""}</div>`);
}
function weddingsSheet(){
  openSheet(`<h3>Weddings</h3>
  <ul class="wlist">${S.weddings.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(w => `<li><button data-pick="${esc(w.id)}" aria-current="${S.cur?.id===w.id}">${esc(w.title)}<span>${esc(w.date || "")}</span></button></li>`).join("") || `<li class="empty" style="padding:10px">None saved yet.</li>`}</ul>
  <div class="actions"><button class="primary" data-act="import">Open wedding file</button><button class="ghost" data-act="blank">Start blank</button></div>
  <p class="status" id="impStatus">Everything is saved on this phone and works with no signal.</p>
  ${S.cur ? `<div class="actions" style="margin-top:24px"><button class="ghost" data-act="ics">Send ${esc(S.cur.title)} alerts to my calendar</button><button class="danger" data-act="delwedding">Delete ${esc(S.cur.title)}</button></div><div class="status" id="icsStatus"></div>` : ""}
  <div class="actions" style="margin-top:16px"><button class="ghost" data-act="backup">Back up all weddings</button><button class="ghost" data-act="restore">Restore a backup</button><button class="ghost" data-act="theme">Switch light / dark</button></div>
  <p class="status">${navigator.onLine ? "Online" : "Offline"} · ${S.weddings.length} wedding${S.weddings.length===1?"":"s"} saved on this phone</p>`);
}

/* ---------- alerts ---------- */
function toast(title, body){
  const t = $("#toast");
  t.innerHTML = `<b>${esc(title)}</b>${esc(body || "")}<br><button>OK</button>`;
  t.classList.add("show");
  $("button", t).onclick = () => t.classList.remove("show");
  try { navigator.vibrate?.([200,100,200]); } catch {}
  try { if (window.Notification && Notification.permission === "granted") navigator.serviceWorker?.ready.then(r => r.showNotification(title, {body: body || "", icon: "icons/icon-192.png", tag: title})); } catch {}
}
function checkAlerts(){
  const w = S.cur; if (!w || !isDay(w)) return;
  const n = nowMin();
  for (const it of w.timeline) {
    const t = toMin(it.time); if (t == null || !it.alert) continue;
    const at = t - it.alert, key = w.id + it.id + it.time;
    if (n >= at && n < t && !S.fired.has(key)) {
      S.fired.add(key);
      const shots = (it.shots||[]).map(id => shot(w,id)?.label).filter(Boolean);
      toast(`${it.time} ${it.event}`, `In ${t - n} min. ${shots.length ? "Shots: " + shots.join(", ") : ""}`);
    }
  }
  if (S.tab === "now" && S.preview == null) render();
}
function icsText(w){
  const d = (w.date || todayISO()).replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z";
  const icsEsc = s => String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g, m => "\\" + m);
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Trevor Keogh Photography//Shoot Day//EN","CALSCALE:GREGORIAN"];
  for (const it of sorted(w)) {
    const t = toMin(it.time); if (t == null) continue;
    const hh = fmt(t).replace(":", "") + "00", end = fmt(Math.min(t + 10, 1439)).replace(":", "") + "00";
    const shots = (it.shots||[]).map(id => shot(w,id)?.label).filter(Boolean);
    const p = place(w, it.place);
    lines.push("BEGIN:VEVENT", `UID:${w.id}-${it.id}@shootday`, `DTSTAMP:${stamp}`, `DTSTART:${d}T${hh}`, `DTEND:${d}T${end}`,
      `SUMMARY:${icsEsc((it.est ? "(est) " : "") + it.event)}`, `DESCRIPTION:${icsEsc([shots.length ? "Shots: " + shots.join(", ") : "", it.notes].filter(Boolean).join("\n"))}`,
      `LOCATION:${icsEsc(p?.name || "")}`);
    if (it.alert) lines.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(it.event)}`,`TRIGGER:-PT${it.alert}M`,"END:VALARM");
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function exportIcs(){
  try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch {}
  const st = $("#icsStatus"), w = S.cur;
  download(w.id + "-alerts.ics", icsText(w), "text/calendar");
  if (st) st.textContent = "Open the file to add every alert to your calendar. Your phone will buzz even with the app closed.";
}

/* ---------- import ---------- */
async function runImport(files){
  const say = t => { const el = $("#impStatus"); if (el) el.textContent = t; };
  let added = [];
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      for (const raw of (Array.isArray(d) ? d : d.weddings || [d])) {
        if (!raw || !Array.isArray(raw.timeline)) continue;
        const w = raw.id && raw.schema ? raw : normalise(raw);
        S.weddings = S.weddings.filter(x => x.id !== w.id); S.weddings.push(w); added.push(w);
      }
    } catch { say(f.name + " isn't a wedding file."); }
  }
  if (!added.length) { say("No weddings found in that file."); return; }
  S.cur = added[0]; S.tab = "now"; saveNow(); closeSheet(); render();
  toast(added.length === 1 ? "Opened " + added[0].title : added.length + " weddings opened", "Saved on this phone. Estimates are marked.");
}
function slug(s){ return String(s||"wedding").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "wedding"; }
function normalise(d){
  const surnames = (d.couple||[]).map(c => (c.name||"").trim().split(/\s+/).at(-1)).filter(Boolean).join("-");
  const w = {
    schema:1, title: d.title || "New wedding", date: d.date || "", guests: d.guests || "", hours: d.hours || "",
    couple: (d.couple || [{},{}]).map(c => ({name:c.name||"", phone:c.phone||"", email:c.email||""})),
    contacts: (d.contacts||[]).filter(c => c.name).map(c => ({role:c.role||"", name:c.name||"", phone:c.phone||""})),
    places: (d.places||[]).map((p,i) => ({key:p.key||"p"+i, kind: KINDS[p.kind] ? p.kind : "other", label:p.label||KINDS[p.kind]||"Place", name:p.name||"", address:p.address||"", arrive:p.arrive||"", contact:p.contact||"", notes:p.notes||""})),
    shots: (d.shots||[]).map((s,i) => ({id:s.id||"s"+i, cat: CATS[s.cat] ? s.cat : "moment", label:s.label||"", notes:s.notes||"", done:false})),
    style: d.style || {tags:[]}, family: d.family || {}, sun: d.sun || {}, weather: d.weather || "",
    flags: (d.flags||[]).map(f => ({text: f.text || String(f), done:false})),
    prep: (d.prep||[]).map(p => ({label:p.label||String(p), done:false})), notes: d.notes || ""
  };
  if (!w.places.length) w.places.push({key:"main", kind:"other", label:"Venue", name:"", address:"", arrive:"", contact:"", notes:""});
  const keys = new Set(w.places.map(p => p.key)), ids = new Set(w.shots.map(s => s.id));
  w.timeline = (d.timeline||[]).map((t,i) => ({id:"t"+(i+1), time:t.time||"", event:t.event||"", place: keys.has(t.place) ? t.place : w.places[0].key, notes:t.notes||"", est:!!t.est, shots:(t.shots||[]).filter(x => ids.has(x)), alert:+t.alert||0}));
  w.id = slug(surnames + "-" + (w.date || Date.now()));
  return w;
}
function blankWedding(){
  const w = normalise({title:"New wedding", date: todayISO(), places:[{key:"ready1",kind:"ready",label:"Getting ready"},{key:"ceremony",kind:"ceremony",label:"Ceremony"},{key:"portraits",kind:"portraits",label:"Portraits"},{key:"reception",kind:"reception",label:"Reception"}], timeline:[{time:"13:00",event:"Arrive",place:"ready1",alert:30}]});
  w.id = "wedding-" + Date.now().toString(36);
  return w;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-goto]"); if (!b) return;
  const w = S.cur, d = b.dataset;
  if (d.tab) { S.tab = d.tab; render(); scrollTo(0,0); return; }
  if (d.goto) { S.tab = d.goto; render(); scrollTo(0,0); return; }
  if (d.shot) { const s = shot(w, d.shot); s.done = !s.done; save(); render(); return; }
  if (d.flag) { w.flags[+d.flag].done = !w.flags[+d.flag].done; save(); render(); return; }
  if (d.prep) { w.prep[+d.prep].done = !w.prep[+d.prep].done; save(); render(); return; }
  if (d.edit) { editItem(d.edit); return; }
  if (d.pick) { S.cur = S.weddings.find(x => x.id === d.pick); S.preview = null; lsSave(); closeSheet(); render(); return; }
  switch (d.act) {
    case "import": $("#fileIn").click(); break;
    case "blank": { const nw = blankWedding(); S.weddings.push(nw); S.cur = nw; S.tab = "day"; save(nw); closeSheet(); render(); break; }
    case "close": closeSheet(); break;
    case "live": S.preview = null; render(); break;
    case "add": editItem(null); break;
    case "ics": exportIcs(); break;
    case "backup": download("shoot-day-backup-" + todayISO() + ".json", JSON.stringify({weddings:S.weddings}, null, 1), "application/json"); break;
    case "restore": $("#restoreIn").click(); break;
    case "theme": { const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches; const curDark = r.dataset.theme ? r.dataset.theme === "dark" : dark; r.dataset.theme = curDark ? "light" : "dark"; try { localStorage.setItem(LS+"-theme", r.dataset.theme); } catch {} break; }
    case "saveitem": {
      const v = id => $("#" + id).value;
      const data = {time:v("f-time"), event:v("f-event") || "Untitled", place:v("f-place"), notes:v("f-notes"), alert:+v("f-alert"), est:$("#f-est").checked, shots:[...document.querySelectorAll(".f-shot:checked")].map(x => x.value)};
      if (d.id) Object.assign(w.timeline.find(t => t.id === d.id), data);
      else w.timeline.push({id:"t" + Date.now().toString(36), ...data});
      save(); closeSheet(); render(); break;
    }
    case "delitem": w.timeline = w.timeline.filter(t => t.id !== d.id); save(); closeSheet(); render(); break;
    case "addshot": { const label = prompt("Shot to add"); if (label) { const cat = (prompt("Type: detail, moment or group", "moment") || "moment").trim().toLowerCase(); w.shots.push({id:"s"+Date.now().toString(36), cat: CATS[cat] ? cat : "moment", label, notes:"", done:false}); save(); render(); } break; }
    case "resetshots": if (confirm("Untick every shot?")) { w.shots.forEach(s => s.done = false); save(); render(); } break;
    case "addperson": { const name = prompt("Name"); if (name) { const role = prompt("Role") || ""; const phone = prompt("Phone") || ""; w.contacts.push({name, role, phone}); save(); render(); } break; }
    case "delwedding": if (confirm("Delete " + w.title + " from this app?")) { const id = w.id; S.weddings = S.weddings.filter(x => x.id !== id); S.cur = S.weddings[0] || null; lsSave(); closeSheet(); render(); } break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "pv") { S.preview = +e.target.value; const sc = scrollY; render(); scrollTo(0, sc); $("#pv")?.focus(); }
  if (e.target.id === "notes") { S.cur.notes = e.target.value; save(); }
});
$("#fileIn").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length) runImport(f); });
$("#restoreIn").addEventListener("change", e => { const f = [...e.target.files]; e.target.value = ""; if (f.length && confirm("Restore this backup? Weddings with the same name are replaced.")) runImport(f); });
$("#scrim").onclick = closeSheet;
$("#weddingsBtn").onclick = weddingsSheet;
$("#whoBtn").onclick = weddingsSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* ---------- boot ---------- */
(async function boot(){
  try { const th = localStorage.getItem(LS+"-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
  S.weddings = lsLoad()?.weddings || [];
  try { navigator.storage?.persist?.(); } catch {}
  const last = lsLoad()?.cur;
  const upcoming = [...S.weddings].filter(w => (w.date||"") >= todayISO()).sort((a,b) => a.date.localeCompare(b.date));
  S.cur = S.weddings.find(w => isDay(w)) || S.weddings.find(w => w.id === last) || upcoming[0] || S.weddings[0] || null;
  render();
  setInterval(checkAlerts, 20000); checkAlerts();
})();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
